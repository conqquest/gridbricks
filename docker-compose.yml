services:
  backend:
    build: ./windscope-uk-starter/backend
    image: windscope-uk-backend:latest
    container_name: windscope-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./windscope-uk-starter/frontend
    image: windscope-uk-frontend:latest
    container_name: windscope-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
